project:
  type: website
  resources:
    # The generated artefacts (APD.ttl/.nq/.nt/.json, the two flat CSVs,
    # APD_triples.csv) are NOT listed here. They live in export/ but are published
    # at the site *root*, because https://traitecoevo.github.io/APD/APD.ttl and the
    # w3id content-negotiation rules pointing at it are a published interface.
    # A quarto resource keeps its relative path, so listing "export/APD.ttl" would
    # move the URL. scripts/build_site.R copies them in after the render instead --
    # and the same goes for assets/406.html, which is published at /406.html.
    # Tells GitHub Pages not to run the site through Jekyll, which would
    # otherwise skip any path beginning with an underscore.
    - ".nojekyll"
    #
    # `release` used to be listed here too, so quarto copied the ~100 MB snapshot
    # tree into docs/ on every render. .github/workflows/deploy.yml copies it
    # instead, after the render, which is the only place it is actually needed --
    # w3id.org/APD/release/<version>/index.html is a live permalink and the deploy
    # has to carry it. Dropping it here means a local `make site` produces a docs/
    # without release/; that is fine now that docs/ is not what gets published.
  output-dir: docs
  render:
    - index.qmd
    - using_the_APD.qmd
    - NEWS.md

website:
  title: "APD"
  site-url: https://traitecoevo.github.io/APD/
  description: The AusTraits Plant Dictionary (APD) Ontology

  repo-url: https://github.com/traitecoevo/APD
  repo-actions: [issue]

  navbar:
    left:
      - href: index.html
        text: Home
      - href: using_the_APD.html
        text: Using the APD
      - href: https://vocabs.ardc.edu.au/viewById/649
        text: ARDC RVA endpoint

    right:
      - text: News
        href: news.html
      - icon: github
        href: https://github.com/traitecoevo/APD/
      - href: http://austraits.org
        text: AusTraits Project

  page-footer:
    center: |
      Built with [Quarto](https://quarto.org/). Definitions licensed
      [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).


format:
  html:
    theme: cosmo
    toc: true
    # The property/value pairs on every entity are a <dl>, and Bootstrap renders
    # a bare <dl> as an unaligned run of lines. This is what pairs them into two
    # columns with a rule between rows -- i.e. the structure the old <table>
    # markup used to give for free.
    css: assets/apd.css

